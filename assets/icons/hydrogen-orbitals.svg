<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none" color="#fff" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
  <title>Cutaway of a 3s orbital</title>
  <g transform="translate(3 0) rotate(24 32 32)">
    <!-- A hemisphere with its circular cut face seen at an angle. -->
    <path d="M32 7a25 25 0 0 0 0 50"/>
    <ellipse cx="32" cy="32" rx="16" ry="25"/>
    <!-- Two radial nodes divide the section into three concentric regions. -->
    <g stroke-width="1.6">
      <ellipse cx="32" cy="32" rx="9.6" ry="15"/>
      <ellipse cx="32" cy="32" rx="3.3" ry="5.2"/>
    </g>
  </g>
</svg>
