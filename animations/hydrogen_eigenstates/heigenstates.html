<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Volumetric Hydrogen Orbitals</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #05070f; font-family: sans-serif; color: #fff; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; z-index: 1; top:0; left:0; }
        #controls { position: absolute; top: 20px; left: 20px; background: rgba(10,15,30,0.95); padding: 20px; border-radius: 10px; border: 1px solid #334155; z-index: 10; width: 260px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h3 { margin: 0 0 15px 0; color: #38bdf8; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; }
        .control-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px; }
        select { width: 100%; background: #1e293b; color: white; border: 1px solid #475569; padding: 6px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
    </style>

    <!-- Load legacy script-scoped CDNs to bypass browser local import map restrictions -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body>
    <div id="controls">
        <h3>Hydrogen Orbital Cloud</h3>
        <div class="control-group">
            <label>Select Eigenstate Shell</label>
            <select id="state-selector">
                <option value="1,0,0">1s (n=1, l=0, m=0) - Spherical Cloud</option>
                <option value="2,1,0">2p_z (n=2, l=1, m=0) - Dumbbell</option>
                <option value="3,2,0">3d_z² (n=3, l=2, m=0) - Dumbbell + Ring</option>
            </select>
        </div>
        <p style="font-size:0.75rem; color:#64748b; line-height:1.4;">
            The density of glowing particles represents the <strong>probability density |Ψ|²</strong>. Click and drag the background to rotate in 3D perspective space.
        </p>
    </div>
    <div id="canvas-container"></div>

    <script>
        // Use traditional window scope vectors to prevent CORS blocks
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(15, 12, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // Bind standard OrbitControls explicitly via the global THREE scope
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // X=Red, Y=Green, Z=Blue spatial baseline axes lines
        const axesHelper = new THREE.AxesHelper(6);
        scene.add(axesHelper);

        let particleSystem = null;
        const totalParticles = 30000;

        function generateOrbitalCloud(n, l, m) {
            if(particleSystem) scene.remove(particleSystem);

            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(totalParticles * 3);
            const colors = new Float32Array(totalParticles * 3);

            let count = 0;
            let attempts = 0;
            const maxAttempts = 500000; 
            const boxSize = n * 12; 

            while (count < totalParticles && attempts < maxAttempts) {
                attempts++;

                const x = (Math.random() - 0.5) * boxSize;
                const y = (Math.random() - 0.5) * boxSize;
                const z = (Math.random() - 0.5) * boxSize;

                const r = Math.sqrt(x*x + y*y + z*z);
                const theta = Math.acos(z / (r || 1)); 

                let psi_squared = 0;

                // Hydrogenic probability density profile equations
                if (n === 1 && l === 0) { 
                    psi_squared = Math.exp(-2 * r);
                } else if (n === 2 && l === 1) { 
                    psi_squared = (Math.pow(r, 2) * Math.exp(-r) * Math.pow(Math.cos(theta), 2)) * 0.15;
                } else if (n === 3 && l === 2) { 
                    psi_squared = (Math.pow(r, 4) * Math.exp(-2 * r / 3) * Math.pow(3 * Math.cos(theta) * Math.cos(theta) - 1, 2)) * 0.005;
                }

                if (Math.random() < psi_squared) {
                    positions[count * 3] = x;
                    positions[count * 3 + 1] = y;
                    positions[count * 3 + 2] = z;

                    // Volumetric energy-level color gradient shifts
                    colors[count * 3] = 0.1 + (r / boxSize);     
                    colors[count * 3 + 1] = 0.6;           
                    colors[count * 3 + 2] = 1.0;            

                    count++;
                }
            }

            // Fill empty buffers safely if loop concludes early
            for (let i = count; i < totalParticles; i++) {
                positions[i * 3] = 0; positions[i * 3 + 1] = 0; positions[i * 3 + 2] = 0;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.08, 
                vertexColors: true, 
                transparent: true, 
                opacity: 0.75, 
                blending: THREE.AdditiveBlending
            });

            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);
        }

        function animate() {
            requestAnimationFrame(animate);
            if(particleSystem) particleSystem.rotation.y += 0.002; // Smooth spatial rotation
            controls.update();
            renderer.render(scene, camera);
        }

        document.getElementById('state-selector').addEventListener('change', function(e) {
            const val = e.target.value.split(',').map(Number);
            generateOrbitalCloud(val[0], val[1], val[2]);
        });

        // Bootstrap execution instantly
        generateOrbitalCloud(1, 0, 0);
        animate();

        window.addEventListener('resize', function() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
