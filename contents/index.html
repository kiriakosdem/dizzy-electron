<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Dizzy Electron</title>
    <script>
        const fragment = location.hash;
        const isLab = fragment.startsWith('#interactive-lessons') || fragment.startsWith('#lab-');
        const destination = new URL(isLab ? '../labs/index.html' : '../articles/index.html', location.href);
        destination.search = location.search;
        const movedFragments = { '#contents-content': '#articles-content', '#upcoming-title': '#math-title' };
        destination.hash = movedFragments[fragment] ?? fragment;
        location.replace(destination);
    </script>
</head>
<body>
    <main>
        <h1>Dizzy Electron</h1>
        <ul>
            <li><a href="../labs/index.html">Εργαστήρια / <span lang="en">Labs</span></a></li>
            <li><a href="../articles/index.html">Κείμενα / <span lang="en">Articles</span></a></li>
        </ul>
    </main>
</body>
</html>
